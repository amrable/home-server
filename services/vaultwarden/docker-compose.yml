networks:
  homeserver:
    external: true
    name: homeserver

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: http://${VAULTWARDEN_IP}:80
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
    volumes:
      - ${DATA_PATH}/vaultwarden:/data
    networks:
      homeserver:
        ipv4_address: ${VAULTWARDEN_IP}