networks:
  homeserver:
    external: true
    name: homeserver

services:
  seafile:
    image: ${SEAFILE_IMAGE:-seafileltd/seafile-mc:13.0-latest}
    container_name: seafile
    restart: unless-stopped
    depends_on:
      seafile-db:
        condition: service_healthy
      seafile-redis:
        condition: service_started
    environment:
      - SEAFILE_MYSQL_DB_HOST=seafile-db
      - SEAFILE_MYSQL_DB_PORT=3306
      - SEAFILE_MYSQL_DB_USER=${SEAFILE_MYSQL_DB_USER:-seafile}
      - SEAFILE_MYSQL_DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD:?Variable is not set or empty}
      - INIT_SEAFILE_MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWORD}
      - SEAFILE_MYSQL_DB_CCNET_DB_NAME=${CCNET_DB:-ccnet_db}
      - SEAFILE_MYSQL_DB_SEAFILE_DB_NAME=${SEAFILE_DB:-seafile_db}
      - SEAFILE_MYSQL_DB_SEAHUB_DB_NAME=${SEAHUB_DB:-seahub_db}
      - TIME_ZONE=${TZ:-UTC}
      - INIT_SEAFILE_ADMIN_EMAIL=${SEAFILE_ADMIN_EMAIL}
      - INIT_SEAFILE_ADMIN_PASSWORD=${SEAFILE_ADMIN_PASSWORD}
      - SEAFILE_SERVER_HOSTNAME=cloud.${TAILNET_DOMAIN}
      - SEAFILE_SERVER_PROTOCOL=https
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - CACHE_PROVIDER=redis
      - REDIS_HOST=seafile-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD:-}
      - ENABLE_SEADOC=true
      - SEADOC_SERVER_URL=https://cloud.${TAILNET_DOMAIN}/sdoc-server
      - ENABLE_NOTIFICATION_SERVER=false
      - SEAFILE_LOG_TO_STDOUT=false
    volumes:
      - ${DATA_PATH}/seafile/shared:/shared
    networks:
      - homeserver

  seadoc:
    image: seafileltd/sdoc-server:2.0-latest
    container_name: seadoc
    restart: unless-stopped
    depends_on:
      - seafile-db
    environment:
      - DB_HOST=seafile-db
      - DB_PORT=3306
      - DB_USER=${SEAFILE_MYSQL_DB_USER:-seafile}
      - DB_PASSWORD=${SEAFILE_MYSQL_DB_PASSWORD:?Variable is not set or empty}
      - DB_NAME=${SEAHUB_DB:-seahub_db}
      - TIME_ZONE=${TZ:-UTC}
      - JWT_PRIVATE_KEY=${SEAFILE_JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SEAHUB_SERVICE_URL=http://seafile
    volumes:
      - ${DATA_PATH}/seadoc:/shared
    networks:
      - homeserver

  seafile-db:
    image: mariadb:10.11
    container_name: seafile-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${SEAFILE_DB_ROOT_PASSWORD:?Variable is not set or empty}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ${DATA_PATH}/seafile/mysql:/var/lib/mysql
    networks:
      - homeserver
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--connect", "--mariadbupgrade", "--innodb_initialized"]
      interval: 20s
      start_period: 30s
      timeout: 5s
      retries: 10

  seafile-redis:
    image: redis:7
    container_name: seafile-redis
    restart: unless-stopped
    command: ["/bin/sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\" --save \"\" --appendonly no"]
    environment:
      - REDIS_PASSWORD=${SEAFILE_REDIS_PASSWORD:-}
    networks:
      - homeserver

  seafile-ts:
    image: tailscale/tailscale:stable
    container_name: seafile-ts
    restart: unless-stopped
    hostname: cloud
    depends_on:
      - seafile
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_PATH}/tailscale/cloud:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - homeserver