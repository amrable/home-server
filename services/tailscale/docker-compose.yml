networks:
  homeserver:
    external: true
    name: homeserver

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: tailscale
    restart: unless-stopped
    hostname: home
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --reset --advertise-routes=${HOMESERVER_SUBNET}
      TS_SERVE_CONFIG: /config/serve.json
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ${DATA_PATH}/tailscale/state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    networks:
      homeserver:
        ipv4_address: ${TAILSCALE_IP}