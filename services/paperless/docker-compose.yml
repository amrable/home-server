networks:
  homeserver:
    external: true
    name: homeserver

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-db
      - paperless-redis
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_DB_DATABASE}
      PAPERLESS_DBUSER: ${PAPERLESS_DB_USERNAME}
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: https://docs.${TAILNET_DOMAIN}
      PAPERLESS_TIME_ZONE: ${TZ:-UTC}
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_CONSUMER_DIR: /usr/src/paperless/consume
      PAPERLESS_MEDIA_ROOT: /usr/src/paperless/media
    volumes:
      - ${DATA_PATH}/paperless/data:/usr/src/paperless/data
      - ${DATA_PATH}/paperless/media:/usr/src/paperless/media
      - ${DATA_PATH}/paperless/consume:/usr/src/paperless/consume
      - ${DATA_PATH}/paperless/export:/usr/src/paperless/export
    networks:
      - homeserver

  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - homeserver

  paperless-db:
    image: postgres:16-alpine
    container_name: paperless-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PAPERLESS_DB_DATABASE}
      POSTGRES_USER: ${PAPERLESS_DB_USERNAME}
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - ${DATA_PATH}/paperless/pgdata:/var/lib/postgresql/data
    networks:
      - homeserver

  paperless-ts:
    image: tailscale/tailscale:stable
    container_name: paperless-ts
    restart: unless-stopped
    hostname: docs
    depends_on:
      - paperless
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_PATH}/tailscale/docs:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - homeserver
