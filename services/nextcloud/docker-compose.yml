networks:
  homeserver:
    external: true
    name: homeserver

services:
  nextcloud-db:
    image: mariadb:11
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ${DATA_PATH}/nextcloud/db:/var/lib/mysql
    networks:
      - homeserver

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - nextcloud-db
    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${TAILNET_DOMAIN}
      OVERWRITEHOST: cloud.${TAILNET_DOMAIN}
      OVERWRITEPROTOCOL: https
    volumes:
      - ${DATA_PATH}/nextcloud/data:/var/www/html
    networks:
      - homeserver

  nextcloud-ts:
    image: tailscale/tailscale:stable
    container_name: nextcloud-ts
    restart: unless-stopped
    hostname: cloud
    depends_on:
      - nextcloud
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_PATH}/tailscale/cloud:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - homeserver