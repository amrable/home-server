<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Receipt Parser</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 24px;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  .sub { margin: 0 0 20px; color: #94a3b8; font-size: .9rem; }
  .summary-bar {
    display: none;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .summary-bar.show { display: flex; }
  .stat {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: .8rem;
    color: #94a3b8;
  }
  .stat b { color: #e2e8f0; font-size: .95rem; }
  .drop {
    border: 2px dashed #475569;
    border-radius: 8px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    color: #94a3b8;
    transition: border-color .15s, color .15s;
  }
  .drop.dragover, .drop:hover { border-color: #38bdf8; color: #e2e8f0; }
  .file-meta {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    background: #0f172a;
    border-radius: 6px;
    font-size: .85rem;
    word-break: break-all;
  }
  .file-meta.show { display: block; }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #0ea5e9;
    color: #0f172a;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
  .status {
    display: none;
    margin-top: 16px;
    font-size: .85rem;
    color: #38bdf8;
  }
  .status.show { display: block; }
  .status.error { color: #f87171; }
  .summary {
    display: none;
    margin-top: 16px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    padding: 16px;
  }
  .summary.show { display: block; }
  .summary h3 { margin: 0 0 10px; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    background: #334155;
    color: #94a3b8;
    font-size: .7rem;
    vertical-align: middle;
    margin-left: 8px;
  }
  .kv { display: flex; justify-content: space-between; margin: 4px 0; font-size: .9rem; }
  .kv b { color: #94a3b8; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: .85rem; }
  th, td { text-align: left; padding: 6px 8px; border-top: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; }
  td.num, th.num { text-align: right; }
  .total { border-top: 2px solid #475569; font-weight: 600; }
  .history { margin-top: 16px; border-top: 1px solid #334155; padding-top: 12px; }
  .history h3 { margin: 0 0 8px; font-size: .95rem; color: #94a3b8; }
  .hist-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: .85rem;
  }
  .hist-row:hover { background: #0f172a; }
  .hist-main { display: flex; flex-direction: column; }
  .hist-date { color: #64748b; font-size: .75rem; }
  .hist-total { font-weight: 600; }
  pre {
    display: none;
    margin: 16px 0 0;
    padding: 12px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 6px;
    overflow-x: auto;
    font-size: .8rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  pre.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1>Receipt Parser</h1>
    <p class="sub">Upload a receipt (PDF or image) — it gets parsed by Gemini and the breakdown is returned.</p>

    <div id="summary-bar" class="summary-bar"></div>

    <div id="drop" class="drop">Drag &amp; drop a file here, or click to browse</div>
    <input id="file" type="file" hidden accept="application/pdf,image/png,image/jpeg,image/webp" />

    <div id="meta" class="file-meta"></div>

    <button id="parse" disabled>Parse receipt</button>

    <div id="status" class="status"></div>

    <div id="summary" class="summary"></div>

    <pre id="out"></pre>

    <div id="history" class="history"></div>
  </div>

<script>
  const API_URL = '/api/parse';
  const euro = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'EUR' });
  const money = (v) => (v == null || isNaN(v) ? '—' : euro.format(v));
  const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const meta = document.getElementById('meta');
  const btn = document.getElementById('parse');
  const status = document.getElementById('status');
  const summary = document.getElementById('summary');
  const out = document.getElementById('out');
  const history = document.getElementById('history');
  const summaryBar = document.getElementById('summary-bar');

  let selected = null;

  function setFile(f) {
    if (!f) return;
    selected = f;
    meta.textContent = f.name + ' — ' + (f.size / 1024).toFixed(1) + ' KB';
    meta.classList.add('show');
    btn.disabled = false;
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('dragover');
    setFile(e.dataTransfer.files[0]);
  });

  function showStatus(msg, isError) {
    status.textContent = msg;
    status.classList.toggle('error', !!isError);
    status.classList.add('show');
  }

  function renderSummary(p, cached) {
    const taxRows = (p.tax || []).map((t) =>
      '<div class="kv"><b>VAT ' + (t.rate_percent ?? '?') + '%</b><span>' + money(t.amount) + '</span></div>'
    ).join('');

    const itemRows = (p.items || []).map((it) =>
      '<tr>' +
        '<td>' + (it.name || '—') + '</td>' +
        '<td class="num">' + (it.quantity ?? '') + '</td>' +
        '<td class="num">' + money(it.unit_price) + '</td>' +
        '<td class="num">' + money(it.total) + '</td>' +
      '</tr>'
    ).join('');

    summary.innerHTML =
      '<h3>' + (p.vendor || 'Unknown vendor') +
        (cached ? '<span class="badge">cached</span>' : '') + '</h3>' +
      '<div class="kv"><b>Date</b><span>' + (p.invoice_date || '—') + '</span></div>' +
      '<div class="kv"><b>Invoice #</b><span>' + (p.invoice_number || '—') + '</span></div>' +
      (p.items.length ? '<table><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Total</th></tr>' + itemRows + '</table>' : '') +
      (taxRows ? taxRows : '') +
      '<div class="kv total"><b>Total</b><span>' + money(p.total) + ' ' + (p.currency || '') + '</span></div>';
    summary.classList.add('show');
    out.classList.remove('show');
  }

  btn.addEventListener('click', async () => {
    if (!selected) return;
    btn.disabled = true;
    summary.classList.remove('show');
    out.classList.remove('show');
    try {
      showStatus('Reading file…');
      const reader = new FileReader();
      const data = await new Promise((resolve, reject) => {
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(selected);
      });

      showStatus('Parsing…');
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          filename: selected.name,
          mimeType: selected.type || 'application/octet-stream',
          data: data.split(',')[1]
        })
      });
      if (!res.ok) throw new Error(await res.text().then((t) => 'HTTP ' + res.status + ': ' + t.slice(0, 300)));
      const json = await res.json();

      status.classList.remove('show');
      renderSummary(json.parsed, json.cached !== undefined ? json.cached : false);
      loadHistory();
      loadSummary();
    } catch (err) {
      showStatus('Failed: ' + err.message, true);
    } finally {
      btn.disabled = false;
    }
  });

  async function loadHistory() {
    try {
      const res = await fetch('/api/receipts');
      if (!res.ok) return;
      const list = await res.json();
      history.innerHTML = '<h3>Past receipts</h3>';
      if (!list.length) {
        history.innerHTML += '<p class="sub">No receipts stored yet.</p>';
        return;
      }
      list.forEach((r) => {
        const p = r.parsed || {};
        const row = document.createElement('div');
        row.className = 'hist-row';
        row.innerHTML =
          '<div class="hist-main">' +
            '<span class="hist-name">' + escapeHtml(p.vendor || r.filename) + '</span>' +
            '<span class="hist-date">' + escapeHtml(r.createdAt) + '</span>' +
          '</div>' +
          '<div class="hist-total">' + money(p.total) + ' ' + escapeHtml(p.currency || '') + '</div>';
        row.addEventListener('click', () => renderSummary(p, true));
        history.appendChild(row);
      });
    } catch (_) { /* non-critical */ }
  }

  async function loadSummary() {
    try {
      const res = await fetch('/api/summary');
      if (!res.ok) return;
      const data = await res.json();
      const s = data.summary || {};
      const currency = Object.keys(s.total || {})[0] || 'EUR';
      const spent = (s.total && s.total[currency]) || 0;
      const vendors = Object.entries(s.by_vendor || {})
        .sort((a, b) => (b[1].total[currency] || 0) - (a[1].total[currency] || 0))
        .slice(0, 3)
        .map(([name, v]) =>
          '<div class="stat">' + escapeHtml(name) + ' <b>' + money(v.total[currency]) + '</b></div>'
        ).join('');
      summaryBar.innerHTML =
        '<div class="stat">Receipts <b>' + (s.count ?? 0) + '</b></div>' +
        '<div class="stat">Total <b>' + money(spent) + '</b> ' + escapeHtml(currency) + '</div>' +
        vendors;
      summaryBar.classList.add('show');
    } catch (_) { /* non-critical */ }
  }

  loadSummary();
  loadHistory();
</script>
</body>
</html>
