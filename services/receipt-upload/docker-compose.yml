networks:
  homeserver:
    external: true
    name: homeserver

services:
  receipt-upload:
    image: nginx:alpine
    container_name: receipt-upload
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - homeserver

  receipt-upload-ts:
    image: tailscale/tailscale:stable
    container_name: receipt-upload-ts
    restart: unless-stopped
    hostname: receipt
    depends_on:
      - receipt-upload
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_PATH}/tailscale/receipt:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - homeserver
