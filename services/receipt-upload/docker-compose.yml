networks:
  homeserver:
    external: true
    name: homeserver

services:
  receipt-upload:
    image: python:3.13-alpine
    container_name: receipt-upload
    restart: unless-stopped
    working_dir: /app
    command: python server.py
    volumes:
      - ./server.py:/app/server.py:ro
      - ./index.html:/app/index.html:ro
      - ${DATA_PATH}/receipt-upload:/app/data
    networks:
      - homeserver

  receipt-upload-ts:
    image: tailscale/tailscale:stable
    container_name: receipt-upload-ts
    restart: unless-stopped
    hostname: receipt
    depends_on:
      - receipt-upload
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ${DATA_PATH}/tailscale/receipt:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    networks:
      - homeserver